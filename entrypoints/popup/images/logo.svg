<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Open SEO">
  <title>Open SEO</title>
  <!--
    Single source of truth for the mark: the popup header imports this file and
    the README points at it, so they cannot drift.

    The gauge is the `gauge` path from shared/Icon.tsx on its 24px grid, scaled
    into the 64px tile. The offset is (8, 8) because 24 x 2 = 48 and
    (64 - 48) / 2 = 8 — centring it matters at 20px. The colours are the
    popup's own accent ramp, from the @theme block in popup.css.
  -->
  <defs>
    <linearGradient id="openSeoAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c6ef5"/>
      <stop offset="1" stop-color="#3b5bdb"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#openSeoAccent)"/>
  <g fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"
     transform="translate(8 8) scale(2)">
    <path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/>
    <path d="M13.4 10.6 18 6"/>
    <path d="M20.5 16a9 9 0 1 0-17 0"/>
  </g>
</svg>
